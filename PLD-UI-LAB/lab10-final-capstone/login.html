<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - Login</title>
    <link rel="stylesheet" href="css/normalize.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="sticky top-0 z-50">
    <h1>Personal Learning Dashboard</h1>
</header>

<main class="flex justify-center items-center min-h-[80vh] px-4">
    <section class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-xl font-semibold text-center mb-4">Login</h2>

        <form class="space-y-4">
            <div>
                <label>Email</label>
                <input type="email" class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label>Password</label>
                <input type="password" class="w-full border px-3 py-2 rounded">
            </div>

            <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Login
            </button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Personal Learning Dashboard</p>
</footer>

</body>
</html>
